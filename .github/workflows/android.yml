name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Archive APK for Release
      if: success()
      run: |
        mkdir -p release
        cp app/build/outputs/apk/release/app-release.apk release/

    - name: Create GitHub Release
      if: success()
      uses: gh-actions/create-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        release_name: "Release v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK to GitHub Release
      if: success()
      uses: gh-actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release/app-release.apk
        asset_name: app-release-${{ github.run_number }}.apk
        asset_content_type: application/vnd.android.package-archive
        token: ${{ secrets.GITHUB_TOKEN }}
